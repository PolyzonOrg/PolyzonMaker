[package]
name = "ark-probe"
version = "0.0.0"
description = "Polyzon Ark shell probe (T-06)"
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "1", features = ["derive"] }

# what a release would ship, so the installer size in the report is the real one
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
