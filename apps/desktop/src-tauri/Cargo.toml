[package]
name = "polyzon-maker"
version = "0.3.2"
description = "Polyzon Maker: 3D models from photos and text on your own computer, ready to print"
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
base64 = "0.22"
tiny_http = "0.12"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
tauri-plugin-notification = "2"

# the system's own TLS where there is one: no C code to build, and the machine's own certificates
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "json"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }

[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
